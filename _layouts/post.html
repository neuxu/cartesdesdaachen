
<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">cartesdesdaachen</a>
  </header>

  <main class="article-page">
    <article class="article-content">
      <a href="{{ '/' | relative_url }}" class="back-link">← Tornar a les cartes</a>
      <p class="eyebrow">UNA CARTA DES D'AACHEN</p>
      <h1>{{ page.title | escape }}</h1>
      <p class="article-date">
        {{ page.date | date: "%-d/%m/%Y" }}
      </p>

      <div class="article-body">
        {{ content }}
      </div>

      <p class="article-signoff">Gràcies per llegir-me. 💌</p>
      <a href="{{ '/' | relative_url }}#subscriu-te">Subscriu-te per rebre les pròximes cartes</a>
    </article>
  </main>

  <footer class="site-footer">
    <a class="brand" href="{{ '/' | relative_url }}">cartesdesdaachen</a>
  </footer>
</body>
</html>
